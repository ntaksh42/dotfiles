# starship.toml - ブランチ・作業状況を一目で把握する設定 (通常フォント対応)
#
# 配置先: ~/.config/starship.toml
# 管理元: このリポジトリの app-settings/starship/starship.toml
#   反映方法: powershell.exe -File tools/Sync-AppSettings.ps1
#
# 記号は一般 Unicode のみで Nerd Font 不要。PUA グリフを使わないため
# フォントフォールバックが効き、どのターミナルでも崩れない。
# Nerd Font を使う場合は各記号をグリフに置き換えると更に見やすくなる
# (例: git_branch.symbol = " ", modified = "✚${count}" など)。

add_newline = false
format = "$directory$git_branch$git_status$git_state$character"
# 右プロンプト: 終了コード・実行時間・時刻を入力行の右端に控えめに表示
right_format = "$status$cmd_duration$time"

[directory]
truncation_length = 3        # 深い階層は末尾 3 つに省略 (ブランチ情報を右に押し出さない)
truncate_to_repo = true      # git リポジトリ内はリポジトリルートからの相対パス
                             # (リポジトリ検出 ~90ms は git 系モジュールと共有されるため追加コストなし)
style = "bold cyan"
format = "[$path]($style) "
read_only = " [ro]"

[git_branch]
symbol = ""                  # グリフを使わない
style = "bold purple"
format = "[$branch]($style) "

# 作業状況: git 標準記号 (+ ! ? ✘ » = $) にカウントを添えて色分け表示 (緊急度で色を統一)。
#   危険/要対応 = bold red (=conflict, ✘del) / 要コミット = yellow系 (!mod, »mv)
#   安全/進捗 = green系 (+add, ⇡ahead) / 情報 = 青系 (?new, $stash) / 要 pull = yellow (⇣behind)
#   +N ステージ済み / !N 変更 / ?N 未追跡 / ✘N 削除 / »N リネーム
#   $N stash / =N 競合 / ⇡N ahead / ⇣N behind
#
# ローカルの変更は [] の中、リモートとの同期状態 (⇡⇣) は [] の外に置く。
# 記号を読まずに「括弧の中に何かあるか」だけで未コミットの有無が判る。
#   例: main [!3 +2 ?1 ] ⇡1  / クリーン時は括弧ごと消えて main のみ
# 項目間の区切りは各変数の末尾空白で付ける ($all_status は連結のみで trim できないため、
# 閉じ括弧の直前に空白 1 個が残る: [!1 +1 ?1 ] 。先頭側に寄せると [ !1 … となり更に目立つ)。
# format で変数を個別に並べ、緊急度順 (競合→削除→変更→改名→ステージ→未追跡→stash) に固定。
# format は TOML リテラル文字列 ('...') にする。基本文字列だと \[ が不正なエスケープになる。
[git_status]
conflicted = "[=${count}](bold red) "
ahead      = "[⇡${count}](green)"
behind     = "[⇣${count}](yellow)"
diverged   = "[⇡${ahead_count}⇣${behind_count}](bold red)"
untracked  = "[?${count}](blue) "
stashed    = "[\\$${count}](cyan) "
modified   = "[!${count}](yellow) "
staged     = "[+${count}](bold green) "
renamed    = "[»${count}](bold yellow) "
deleted    = "[✘${count}](bold red) "
format = '([\[](dimmed white)[$conflicted$deleted$modified$renamed$staged$untracked$stashed]()[\]](dimmed white) )([$ahead_behind]() )'

# rebase / merge / cherry-pick / bisect の途中状態を表示 (進捗付き)
[git_state]
style = "bold red"
format = '\([$state( $progress_current/$progress_total)]($style)\) '

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"

# --- 右プロンプト用モジュール ---

# 直前コマンドの終了コード (0 以外のときだけ表示)
[status]
disabled = false
format = "[✘$status]($style) "
style = "bold red"

# 2 秒以上かかったコマンドの実行時間
[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "yellow"

# 現在時刻 (スクロールバックでいつ実行したか追える)
[time]
disabled = false
format = "[$time]($style)"
style = "dimmed white"
time_format = "%H:%M"
