<!DOCTYPE html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<!-- report-sheet -->
<!--
  報告シートの雛形。会話で書くと長くなる報告・相談を、図 1 枚と短い句で見せる。
  - 骨格は固定: 要点のタイトル → 結論 1 文 → 図 → (根拠の表) → (注意点) → 畳み付録
  - 先に要点を 1 つ決める。タイトルに 1 行で書き、図では要点の要素だけを class="key" で赤くする。他は灰色
  - 図は SKILL.md「図の選び方」から選ぶ (流れ・構成・前後・状態の格子・横棒)。説明は文章でなく図のラベルに書く
  - 文字の上限: 本文 300 字、結論 80 字、表のセル 40 字 (SVG と <details> の中は数えない)
  - 問い・選択肢・推奨はシートに書かない。[判断] は会話で聞く
  - 色は Orca のテーマ変数を優先し、無い環境 (ブラウザ) では固定色に戻る。赤は要点と注意点だけに使う
  - 相対 URL 禁止。100vh 禁止
-->
<title><!-- TODO: タイトル --></title>
<style>
:root{
  --ag-ink:var(--foreground,#212529);--ag-muted:var(--muted-foreground,#64707C);
  --ag-line:var(--border,#DEE2E6);--ag-paper:var(--background,#FFFFFF);
  --ag-dim:var(--muted,#F6F8FA);--ag-link:var(--primary,#2563EB);--ag-red:#DC2626}
*{box-sizing:border-box}
body{background:var(--ag-paper);color:var(--ag-ink);font-family:'IBM Plex Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic UI','Meiryo',sans-serif;font-size:15px;line-height:1.75;margin:0;padding:12px 20px 24px}
main{max-width:1000px;margin:0 auto}
h1{font-size:22px;line-height:1.45;margin:4px 0 10px}
h2{font-size:17px;line-height:1.45;margin:22px 0 6px;padding-bottom:3px;border-bottom:1px solid var(--ag-line)}
p{margin:6px 0}
a{color:var(--ag-link)}
.concl{border:1px solid var(--ag-line);border-left:3px solid var(--ag-red);border-radius:8px;padding:10px 16px}
.mono{font-family:'IBM Plex Mono',Consolas,Menlo,monospace;font-size:13px;color:var(--ag-muted)}
table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.6;margin:6px 0}
th,td{border-bottom:1px solid var(--ag-line);padding:6px 8px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--ag-muted);font-weight:500;white-space:nowrap}
td.no{width:2.5em;color:var(--ag-muted);font-family:'IBM Plex Mono',Consolas,monospace}
.warn{border-left:3px solid var(--ag-red);padding:4px 12px;margin:6px 0}
ul{margin:6px 0;padding-left:1.4em}
details{border:1px solid var(--ag-line);border-radius:8px;padding:8px 14px;margin:18px 0 6px}
summary{cursor:pointer;color:var(--ag-link);font-size:13.5px}
/* 図: 要点 (.key) だけ赤、他は灰色 */
svg text{fill:var(--ag-ink);font-size:14px}
svg .sub{fill:var(--ag-muted);font-size:12px}
svg rect,svg line,svg path{stroke:var(--ag-muted);fill:none;stroke-width:1.5}
svg .key rect,svg .key line,svg .key path{stroke:var(--ag-red);stroke-width:3}
svg .key text{fill:var(--ag-red);font-weight:700}
</style></head>
<body><main>

<h1><!-- TODO: 要点を 1 行で言い切る (読み手が 1 つだけ持ち帰ること) --></h1>
<div class="concl"><b>結論:</b> <!-- TODO: 1 文・80 字以内 --></div>

<!-- 図: インライン SVG 1 枚 (多くても 2 枚)。見出しは付けない。要点の要素だけ <g class="key"> で包む -->
<svg viewBox="0 0 960 240" width="100%" role="img" aria-label="<!-- TODO: 図の内容 -->">
<!-- TODO: 図を描く。例: <g><rect x="20" y="80" width="200" height="60" rx="8"/><text x="120" y="115" text-anchor="middle">現状</text></g>
     <g class="key"><rect x="380" y="80" width="200" height="60" rx="8"/><text x="480" y="115" text-anchor="middle">ここが壊れていた</text></g> -->
</svg>

<!-- 根拠の表: 図だけでは足りない根拠を引くときだけ置く。無ければ削る。セルは句で書く -->
<table>
<tr><th>#</th><th><!-- TODO --></th><th>根拠</th></tr>
<tr><td class="no">①</td><td><!-- TODO --></td><td class="mono"><!-- TODO: file:line --></td></tr>
</table>

<!-- 注意点: 失敗したテスト・飛ばした作業・未確認のこと。無ければ節ごと削る -->
<h2>注意点</h2>
<div class="warn"><!-- TODO --></div>

<!-- 畳み付録: 読みたい人だけ読む経緯・実行ログ。summary は中身を予告する。無ければ削る -->
<details><summary><!-- TODO: 例「調べたファイル 6 つと実行ログ」 --></summary>
<p class="mono"><!-- TODO --></p>
</details>

</main></body></html>
