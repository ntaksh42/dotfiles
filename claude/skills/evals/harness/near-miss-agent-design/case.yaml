schema_version: "1.1"
name: harness-near-miss-agent-design
tags: [harness, near-miss]
execution:
  prompt: >-
    問い合わせを分類するエージェントを設計中です。返答の根拠を確認する役を別にすると、どんな利点がありますか？
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Bash, PowerShell]
graders:
  - name: skill-not-called
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?harness"'
    min: 0
    max: 0
