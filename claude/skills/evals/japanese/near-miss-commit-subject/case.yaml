schema_version: "1.1"
name: japanese-near-miss-commit-subject
tags: [japanese, near-miss]
execution:
  prompt: >-
    検索条件の保存に対応しました。この変更のコミットメッセージを日本語で 1 行だけ考えてください。
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Bash, PowerShell]
graders:
  - name: skill-not-called
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?japanese"'
    min: 0
    max: 0
