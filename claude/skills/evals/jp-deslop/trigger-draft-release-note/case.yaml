schema_version: "1.1"
name: jp-deslop-trigger-draft-release-note
tags: [jp-deslop, should-trigger]
execution:
  prompt: >-
    CHANGELOG に載せる日本語の説明を考えてください。以前は検索条件が画面を閉じるたびに消えていましたが、今回から次に開いたときも残ります。
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Bash, PowerShell]
graders:
  - name: skill-called
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?jp-deslop"'
    min: 1
