schema_version: "1.1"
name: jp-deslop-trigger-shorter-prose
tags: [jp-deslop, should-trigger]
execution:
  prompt: >-
    次の説明を、意味を保ったまま端的にして。「接続先の設定に変更があった場合においては、アプリケーションの再起動を行う必要があります。」
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Bash, PowerShell]
graders:
  - name: skill-called
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?jp-deslop"'
    min: 1
