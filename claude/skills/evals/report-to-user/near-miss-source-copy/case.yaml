schema_version: "1.1"
name: report-to-user-near-miss-source-copy
tags: [report-to-user, near-miss]
execution:
  prompt: >-
    利用者向けの README に載せる「はじめに」の原稿を書いてください。このツールはローカルのフォルダーを検索してファイルを開くためのものです。
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Bash, PowerShell]
graders:
  - name: skill-not-called
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?report-to-user"'
    min: 0
    max: 0
