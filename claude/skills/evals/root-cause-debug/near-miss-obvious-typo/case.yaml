schema_version: "1.1"
name: root-cause-debug-near-miss-obvious-typo
tags: [root-cause-debug, near-miss]
execution:
  prompt: >-
    TypeScript が `Cannot find name 'lenght'. Did you mean 'length'?` と出しています。`lenght` を `length` に直してください。
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Bash, PowerShell]
graders:
  - name: skill-not-called
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?root-cause-debug"'
    min: 0
    max: 0
