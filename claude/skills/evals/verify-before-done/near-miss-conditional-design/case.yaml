schema_version: "1.1"
name: verify-before-done-near-miss-conditional-design
tags: [verify-before-done, near-miss]
execution:
  prompt: >-
    まだ実装はしていません。保存処理を同期で行う案だと、画面の待ち時間にどう影響しますか？
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Bash, PowerShell]
graders:
  - name: skill-not-called
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?verify-before-done"'
    min: 0
    max: 0
