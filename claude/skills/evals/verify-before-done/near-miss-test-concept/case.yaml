schema_version: "1.1"
name: verify-before-done-near-miss-test-concept
tags: [verify-before-done, near-miss]
execution:
  prompt: >-
    単体テストと結合テストは、何を確かめるものか一文ずつ教えてください。
  allowed_tools: [Read, Grep, Glob, Skill]
  disallowed_tools: [Bash, PowerShell]
graders:
  - name: skill-not-called
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?verify-before-done"'
    min: 0
    max: 0
