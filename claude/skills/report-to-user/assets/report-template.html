<!DOCTYPE html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<!-- report-sheet -->
<!--
  報告シートの雛形。会話で書くと長くなる報告・相談を、図 1 枚と項目の表で見せる。
  - 骨格は固定: 要点のタイトル → 結論 1 文 → (図: 形が要るときだけ) → 項目の表 (3 列: 項目 / 確認したこと・根拠 / 対応案) → (要判断: 決めてもらう事項があるときだけ) → (注意点) → 畳み付録
  - 読み手が判断・行動・確認に使う情報は本文 (図と表) に出す。畳むのは経緯・手順・ログ・生データだけ
  - 先に要点を 1 つ決める。タイトルに 1 行で書き、図では要点の要素だけを class="key" で赤くする。他は灰色
  - 図は SKILL.md「図の選び方」から選ぶ (流れ・構成・前後・状態の格子・横棒)。説明は文章でなく図のラベルに書く
  - 文字の上限: 本文 600 字、結論 80 字、表のセル 60 字 (SVG と <details> の中は数えない)。畳みを本文より長くしない
  - 決めてもらう事項は「要判断」の背景付きブロックに 1 問ずつ、推奨を先に、他案を後に書く。回答用の入力欄は置かず、答えは会話の [判断] で受ける (問いを揃える)
  - 色は Orca のテーマ変数を優先し、無い環境 (ブラウザ) では固定色に戻る
  - 赤は要点 1 つだけ (タイトル横の結論の線と、図の class="key")。表や注意点には使わない
  - 表は重要な行を上から並べ、先に対応すべき行の項目名に <span class="priority">先に対応</span> を付ける。根拠 (file:line か実行結果) は「確認したこと」セルの下に <code class="evidence-line"> で置く。確度は、推測の行だけ <span class="badge guess">推測</span> を付ける。付いていない行は確認済み
  - 相対 URL 禁止。100vh 禁止
-->
<title><!-- TODO: タイトル --></title>
<style>
:root{
  --ag-ink:var(--foreground,#212529);--ag-muted:var(--muted-foreground,#64707C);
  --ag-line:var(--border,#DEE2E6);--ag-paper:var(--background,#FFFFFF);
  --ag-dim:var(--muted,#F6F8FA);--ag-link:var(--primary,#2563EB);--ag-red:#DC2626;--ag-amber:#B45309}
*{box-sizing:border-box}
body{background:var(--ag-paper);color:var(--ag-ink);font-family:'IBM Plex Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic UI','Meiryo',sans-serif;font-size:15px;line-height:1.75;margin:0;padding:12px 20px 24px}
main{max-width:1000px;margin:0 auto}
h1{font-size:22px;line-height:1.45;margin:4px 0 10px}
h2{font-size:17px;line-height:1.45;margin:22px 0 6px;padding-bottom:3px;border-bottom:1px solid var(--ag-line)}
p{margin:6px 0}
a{color:var(--ag-link)}
.concl{border:1px solid var(--ag-line);border-left:3px solid var(--ag-red);border-radius:8px;padding:10px 16px}
.mono,.evidence-line{font-family:'IBM Plex Mono',Consolas,Menlo,monospace;font-size:13px;color:var(--ag-muted)}
table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.6;margin:6px 0}
th,td{border-bottom:1px solid var(--ag-line);padding:6px 8px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
thead th{font-size:12px;color:var(--ag-muted);font-weight:500}
tbody th{font-size:14px;font-weight:700}
td p{margin:0}
.evidence-line{display:block;font-size:12px;line-height:1.6;margin-top:6px}
.priority{display:block;font-size:11px;font-weight:500;color:var(--ag-red);margin-bottom:2px}
.decision{background:var(--ag-dim);border-radius:8px;padding:12px 16px;margin:18px 0 6px}
.decision h2{border:0;margin:0 0 6px;padding:0}
.choice{display:grid;grid-template-columns:3em 1fr;gap:8px;margin:4px 0;font-size:14px}
.choice b{font-size:12px;padding-top:2px}
.choice p{margin:0}
.choice.alt{color:var(--ag-muted)}
td.no{width:2.5em;color:var(--ag-muted);font-family:'IBM Plex Mono',Consolas,monospace}
.warn{border-left:3px solid var(--ag-muted);padding:4px 12px;margin:6px 0}
/* 色: 赤 = 要点 1 つだけ / 琥珀 = 推測のバッジだけ / 他は灰。確認済みにはバッジを付けない */
.badge{display:inline-block;font-size:12px;line-height:1.5;font-weight:700;padding:0 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.badge.guess{color:var(--ag-amber)}
ul{margin:6px 0;padding-left:1.4em}
details{border:1px solid var(--ag-line);border-radius:8px;padding:8px 14px;margin:18px 0 6px}
summary{cursor:pointer;color:var(--ag-link);font-size:13.5px}
/* 図: 要点 (.key) だけ赤、他は灰色 */
svg text{fill:var(--ag-ink);font-size:14px}
svg .sub{fill:var(--ag-muted);font-size:12px}
svg rect,svg line,svg path{stroke:var(--ag-muted);fill:none;stroke-width:1.5}
svg .key rect,svg .key line,svg .key path{stroke:var(--ag-red);stroke-width:3}
svg .key text{fill:var(--ag-red);font-weight:700}
</style></head>
<body><main>

<h1><!-- TODO: 要点を 1 行で言い切る (読み手が 1 つだけ持ち帰ること) --></h1>
<div class="concl"><b>結論:</b> <!-- TODO: 1 文・80 字以内。根拠から「だから」でつながる形にし、推測に頼るならそう書く --></div>

<!-- 図は任意。形 (流れ・構造・前後の違い・量) が分からないと伝わらないときだけ置く。表で足りるなら <svg> ごと削る。
     置くなら 1 枚 (多くても 2 枚)、見出しは付けない。要点の要素だけ <g class="key"> で包む -->
<!-- 文字を消しても形だけで意味が通る図にする -->

<svg viewBox="0 0 960 240" width="100%" role="img" aria-label="<!-- TODO: 図の内容 -->">
<!-- TODO: 図を描く。例: <g><rect x="20" y="80" width="200" height="60" rx="8"/><text x="120" y="115" text-anchor="middle">現状</text></g>
     <g class="key"><rect x="380" y="80" width="200" height="60" rx="8"/><text x="480" y="115" text-anchor="middle">ここが壊れていた</text></g> -->
</svg>

<!-- 項目の表: 1 行 1 項目、3 列。何が・なぜ・どうするかを句で書き、根拠はセルの下に添える。
     重要な行を上に並べ、先に対応すべき行の項目名に <span class="priority">先に対応</span> を付ける。確度は推測の行だけ <span class="badge guess">推測</span> を付ける (無ければ確認済み) -->
<table>
<colgroup><col style="width:18%"><col style="width:46%"><col style="width:36%"></colgroup>
<thead><tr><th>項目</th><th>確認したこと・根拠</th><th>対応案</th></tr></thead>
<tbody>
<tr><th scope="row"><span class="priority"><!-- TODO: 先に対応する行だけ「先に対応」。他は span ごと削る --></span><!-- TODO: 項目 --></th><td><p><!-- TODO: 確認したこと --></p><code class="evidence-line"><!-- TODO: file:line か実行結果 --></code></td><td><!-- TODO: 対応案 --></td></tr>
</tbody>
</table>

<!-- 要判断: 決めてもらう事項があるときだけ。1 問ずつブロックを置く (通常 1〜3 件、多くても 4 件)。推奨を先に書く。無ければブロックごと削る -->
<section class="decision">
<h2>要判断: <!-- TODO: 問い --></h2>
<div class="choice"><b>推奨</b><p><!-- TODO: 案の名前 — 理由 --></p></div>
<div class="choice alt"><b>他案</b><p><!-- TODO: 案の名前 — 利点 / 代償 --></p></div>
</section>

<!-- 注意点: 失敗したテスト・飛ばした作業・未確認のこと。無ければ節ごと削る -->
<h2>注意点</h2>
<div class="warn"><!-- TODO --></div>

<!-- 畳み付録: 読みたい人だけ読む経緯・調べた手順・実行ログ。判断や行動に要る項目はここに入れない。summary は中身を予告する。無ければ削る -->
<details><summary><!-- TODO: 例「調べたファイル 6 つと実行ログ」 --></summary>
<p class="mono"><!-- TODO --></p>
</details>

</main></body></html>
