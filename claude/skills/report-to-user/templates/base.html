<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
  /* 色は Orca のテーマ変数を優先し、無い環境 (普通のブラウザ) では固定色に戻る。
     Orca の変数 (--background, --border など) を :root で上書きすると
     表示側のテーマ切り替えが効かなくなるので、ここでは --rp- の名前だけを定義する。
     種別の色 (--rp-kind) は見出しの印と表の罫など、面積の小さい所にだけ使う。 */
  :root {
    --rp-ink: var(--foreground, #1f2328);
    --rp-muted: var(--muted-foreground, #656d76);
    --rp-line: var(--border, #d8dee4);
    --rp-paper: var(--background, #ffffff);
    --rp-dim: var(--muted, #f6f8fa);
    --rp-link: var(--primary, #2563eb);
    --rp-kind: {{ACCENT_COLOR}};
    --rp-kind-bg: {{ACCENT_LIGHT}};
    --rp-red: #cf222e;   --rp-red-bg: rgba(207, 34, 46, .10);
    --rp-amber: #9a6700; --rp-amber-bg: rgba(212, 167, 44, .16);
    --rp-green: #1a7f37; --rp-green-bg: rgba(26, 127, 55, .10);
    --rp-blue: #0969da;  --rp-blue-bg: rgba(9, 105, 218, .10);
    --rp-sans: var(--font-sans, 'IBM Plex Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Meiryo', sans-serif);
    --rp-mono: var(--font-mono, 'IBM Plex Mono', 'Cascadia Code', Consolas, monospace);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --rp-ink: var(--foreground, #e6edf3);
      --rp-muted: var(--muted-foreground, #9198a1);
      --rp-line: var(--border, #30363d);
      --rp-paper: var(--background, #0d1117);
      --rp-dim: var(--muted, #161b22);
      --rp-link: var(--primary, #4493f8);
      --rp-kind: {{ACCENT_ON_DARK}};
      --rp-kind-bg: {{ACCENT_DIM}};
      --rp-red: #ff7b72;   --rp-red-bg: rgba(248, 81, 73, .15);
      --rp-amber: #e3b341; --rp-amber-bg: rgba(187, 128, 9, .18);
      --rp-green: #56d364; --rp-green-bg: rgba(46, 160, 67, .15);
      --rp-blue: #79c0ff;  --rp-blue-bg: rgba(56, 139, 253, .15);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px 20px 40px;
    background: var(--rp-paper);
    color: var(--rp-ink);
    font-family: var(--rp-sans);
    font-size: 15px;
    line-height: 1.75;
  }
  .container { max-width: 960px; margin: 0 auto; }
  a { color: var(--rp-link); }
  code { font-family: var(--rp-mono); font-size: 0.88em; }

  /* ---- 見出し部 ---- */
  .meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 14px;
    font-family: var(--rp-mono);
    font-size: 12px;
    color: var(--rp-muted);
  }
  .kind {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--rp-sans);
    font-weight: 700;
    color: var(--rp-ink);
  }
  .kind::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 2px;
    background: var(--rp-kind);
  }
  h1 {
    font-size: 26px;
    line-height: 1.4;
    margin: 6px 0 18px;
    letter-spacing: 0.01em;
  }

  /* ---- 重大・注意の件数 ---- */
  .severity-bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
  .sev {
    font-size: 13px;
    font-weight: 700;
    border-radius: 999px;
    padding: 2px 12px;
  }
  .sev-red    { background: var(--rp-red-bg);   color: var(--rp-red); }
  .sev-yellow { background: var(--rp-amber-bg); color: var(--rp-amber); }

  /* ---- 要約 (サマリーカード) ----
     値は文で書かれることもあるので、大きな字で目立たせず、本文と同じ大きさで折り返す */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    border-top: 1.5px solid var(--rp-ink);
    border-bottom: 1px solid var(--rp-line);
    margin: 0 0 28px;
  }
  .summary-card { padding: 10px 16px 12px 0; }
  .summary-card + .summary-card { padding-left: 16px; border-left: 1px solid var(--rp-line); }
  .summary-card .label {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--rp-muted);
    letter-spacing: 0.06em;
  }
  .summary-card .value { font-size: 15px; font-weight: 600; line-height: 1.6; margin-top: 2px; }
  .summary-card .sub { font-size: 13px; color: var(--rp-muted); margin-top: 2px; }
  .summary-card .sub:empty { display: none; }

  /* ---- 目次 ---- */
  .toc {
    background: var(--rp-dim);
    border-radius: 8px;
    padding: 12px 18px;
    margin: 0 0 8px;
  }
  .toc .toc-title {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--rp-muted);
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }
  .toc ol {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 0 24px;
  }
  .toc a {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 2px 0;
    font-size: 14px;
    color: var(--rp-ink);
    text-decoration: none;
  }
  .toc a:hover .toc-label { color: var(--rp-link); text-decoration: underline; }
  .toc .toc-label { flex: 1; }
  .toc .toc-flag {
    font-size: 11px;
    font-weight: 700;
    border-radius: 4px;
    padding: 0 6px;
    font-variant-numeric: tabular-nums;
  }
  .toc-red    { background: var(--rp-red-bg);   color: var(--rp-red); }
  .toc-yellow { background: var(--rp-amber-bg); color: var(--rp-amber); }

  /* ---- 節 ---- */
  .section { margin-top: 36px; scroll-margin-top: 12px; }
  .section:first-of-type { margin-top: 24px; }
  .section-header {
    font-size: 19px;
    font-weight: 700;
    line-height: 1.45;
    padding: 0 0 6px 12px;
    border-left: 4px solid var(--rp-kind);
    margin-bottom: 12px;
  }
  .content > :first-child { margin-top: 0; }
  .content p { margin: 0 0 12px; }
  .content h3 { font-size: 16px; margin: 22px 0 8px; }
  .content ul, .content ol { margin: 0 0 12px; padding-left: 1.5em; }
  .content li { margin: 2px 0; }
  .content li > ul, .content li > ol { margin: 2px 0 0; }
  p code, li code, td code, th code, .section-header code, .toc code, blockquote code {
    background: var(--rp-dim);
    border: 1px solid var(--rp-line);
    border-radius: 4px;
    padding: 0 4px;
  }

  /* ---- 表 ---- */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    line-height: 1.6;
    margin: 4px 0 14px;
  }
  th, td {
    padding: 7px 10px 7px 0;
    text-align: left;
    vertical-align: top;
    border-bottom: 1px solid var(--rp-line);
    overflow-wrap: anywhere;
  }
  thead th {
    font-size: 12px;
    font-weight: 700;
    color: var(--rp-muted);
    letter-spacing: 0.04em;
    border-bottom: 1.5px solid var(--rp-ink);
  }
  tbody tr:hover td { background: var(--rp-dim); }

  /* ---- バッジ ([!red 重大] 記法) ---- */
  .tag {
    display: inline-block;
    font-size: 11.5px;
    font-weight: 700;
    line-height: 1.6;
    border-radius: 4px;
    padding: 0 7px;
    margin: 0 2px 0 0;
    white-space: nowrap;
  }
  .tag-red    { background: var(--rp-red-bg);   color: var(--rp-red); }
  .tag-yellow { background: var(--rp-amber-bg); color: var(--rp-amber); }
  .tag-green  { background: var(--rp-green-bg); color: var(--rp-green); }
  .tag-blue   { background: var(--rp-blue-bg);  color: var(--rp-blue); }
  .tag-gray   { background: var(--rp-dim);      color: var(--rp-muted); border: 1px solid var(--rp-line); }

  /* ---- コード ---- */
  pre {
    background: var(--rp-dim);
    color: var(--rp-ink);
    border: 1px solid var(--rp-line);
    border-radius: 8px;
    padding: 12px 14px;
    margin: 4px 0 14px;
    overflow-x: auto;
    font-family: var(--rp-mono);
    font-size: 13px;
    line-height: 1.6;
  }
  pre code { font-size: inherit; }

  /* ---- 引用 ---- */
  blockquote {
    margin: 4px 0 14px;
    padding: 8px 14px;
    border-left: 3px solid var(--rp-kind);
    background: var(--rp-kind-bg);
    border-radius: 0 6px 6px 0;
    font-size: 14px;
  }

  /* ---- 折りたたみ (長い表の残り行) ---- */
  details { margin: 0 0 14px; }
  details summary {
    cursor: pointer;
    color: var(--rp-link);
    font-size: 13.5px;
    padding: 4px 0;
    user-select: none;
  }

  /* ---- 図 (SVG / Mermaid) ---- */
  .figure, pre.mermaid {
    background: transparent;
    border: 1px solid var(--rp-line);
    border-radius: 8px;
    padding: 16px;
    margin: 4px 0 14px;
    overflow-x: auto;
  }
  .figure svg, pre.mermaid svg { display: block; max-width: 100%; height: auto; margin: 0 auto; }
  /* 描画前・描画できなかったときは図の定義がそのまま見える。
     中央揃えの本文体にすると読めないので、コードとして読める体裁にしておく */
  pre.mermaid:not([data-processed]) {
    background: var(--rp-dim);
    white-space: pre;
    font-family: var(--rp-mono);
    font-size: 12.5px;
    color: var(--rp-muted);
  }
  .mermaid-note { font-size: 12.5px; color: var(--rp-muted); margin: 4px 0 4px; }

  /* ---- 進捗バー (:::bar 記法) ---- */
  .bar-row {
    display: grid;
    grid-template-columns: minmax(80px, 1fr) 3fr 3.5rem;
    align-items: center;
    gap: 12px;
    margin: 6px 0;
    font-size: 14px;
  }
  .bar-label { color: var(--rp-muted); }
  .bar-track { background: var(--rp-dim); border: 1px solid var(--rp-line); border-radius: 999px; height: 10px; overflow: hidden; }
  .bar-fill { background: var(--rp-kind); height: 100%; }
  .bar-value { font-family: var(--rp-mono); font-size: 13px; text-align: right; }

  /* ---- 末尾 ---- */
  .footer {
    margin-top: 48px;
    padding-top: 10px;
    border-top: 1px solid var(--rp-line);
    font-family: var(--rp-mono);
    font-size: 11.5px;
    color: var(--rp-muted);
  }

  /* 先頭へ戻る。Orca では枠が本文の高さに合わせて伸びるので、スクロールが起きず出てこない */
  .to-top {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--rp-line);
    background: var(--rp-paper);
    color: var(--rp-ink);
    font-size: 16px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .to-top.visible { opacity: 1; pointer-events: auto; }
  @media (prefers-reduced-motion: reduce) { .to-top { transition: none; } }

  @media (max-width: 600px) {
    body { padding: 14px 16px 32px; }
    h1 { font-size: 22px; }
    .summary-card + .summary-card { padding-left: 0; border-left: 0; border-top: 1px solid var(--rp-line); }
  }

  @media print {
    :root {
      --rp-ink: #1f2328; --rp-muted: #656d76; --rp-line: #d8dee4;
      --rp-paper: #ffffff; --rp-dim: #f6f8fa;
    }
    body { padding: 0; }
    .section, .summary-card, tr, .figure { break-inside: avoid; }
    details > summary { display: none; }
    .toc, .to-top { display: none; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="meta">{{META}}</div>
    <h1>{{TITLE}}</h1>
  </header>

  {{SEVERITY}}

  {{SUMMARY_CARDS}}

  {{TOC}}

  {{MAIN_CONTENT}}

  <div class="footer">{{DOC_ID}} · {{DATE}} · Claude Code</div>
</div>

<button class="to-top" id="to-top" title="先頭へ戻る" aria-label="先頭へ戻る">&uarr;</button>

<script>
  // 長いレポートで先頭へ戻るための補助。失敗しても本文には影響しない。
  (function () {
    var toTop = document.getElementById('to-top');
    function update() { toTop.classList.toggle('visible', window.scrollY > 400); }
    window.addEventListener('scroll', update, { passive: true });
    toTop.addEventListener('click', function () {
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
    });
    update();
  })();
</script>
</body>
</html>
