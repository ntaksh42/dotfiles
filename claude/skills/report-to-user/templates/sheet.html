<!DOCTYPE html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<!-- report-sheet{{LAYOUT}} -->
<!-- scripts/new-sheet.py が二重波括弧の欄を埋めて出力する。シートと詳細で同じ雛形を使う。手で埋めない。色は Orca のテーマ変数を優先し、無い環境では固定色に戻る -->
<title>{{TAB_TITLE}}</title>
<style>
:root{
  --ag-ink:var(--foreground,#212529);--ag-muted:var(--muted-foreground,#64707C);
  --ag-line:var(--border,#DEE2E6);--ag-paper:var(--background,#FFFFFF);
  --ag-dim:var(--muted,#F6F8FA);--ag-link:var(--primary,#2563EB);
  --ag-red:#DC2626;--ag-red-bg:rgba(220,38,38,.12);
  --ag-amber:#B45309;--ag-amber-dot:#D97706;--ag-amber-bg:rgba(217,119,6,.10);
  --ag-green:#15803D;--ag-green-bg:rgba(22,163,74,.12)}
@media (prefers-color-scheme:dark){:root{--ag-ink:var(--foreground,#E6E8EB);--ag-muted:var(--muted-foreground,#9AA4AE);--ag-line:var(--border,#343A40);--ag-paper:var(--background,#16181B);--ag-dim:var(--muted,#22262A);--ag-link:var(--primary,#6EA0FF);--ag-red:#F87171;--ag-amber:#FBBF24;--ag-green:#4ADE80}}
*{box-sizing:border-box}
/* Segoe UI を和文フォントより先に置く: Yu Gothic と Meiryo はバックスラッシュを ¥ で描くため、英数字だけ Segoe UI に任せる */
body{background:var(--ag-paper);color:var(--ag-ink);font-family:'IBM Plex Sans JP','Segoe UI','Hiragino Kaku Gothic ProN','Yu Gothic UI','Meiryo',sans-serif;font-size:15px;line-height:1.75;margin:0;padding:12px 20px 28px}
main{max-width:1000px;margin:0 auto}
a{color:var(--ag-link)}
code{font-family:'IBM Plex Mono',Consolas,Menlo,monospace;font-size:.9em}
.meta{font-family:'IBM Plex Mono',Consolas,monospace;font-size:11.5px;color:var(--ag-muted);letter-spacing:.04em}
h1{font-size:22px;line-height:1.45;margin:4px 0 10px}
.state{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:1px 11px;border-radius:999px;margin-right:10px;vertical-align:3px;white-space:nowrap;background:var(--ag-dim);color:var(--ag-muted)}
.state::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.state.ask{background:var(--ag-amber-bg);color:var(--ag-amber)}
.state.act{background:var(--ag-red-bg);color:var(--ag-red)}
.sub{margin:0 0 8px;color:var(--ag-ink)}
.next{display:flex;gap:12px;align-items:baseline;background:var(--ag-dim);border-radius:6px;padding:8px 14px;font-size:14px}
.next b{font-size:12px;color:var(--ag-muted);white-space:nowrap}
.points{margin:12px 0 0;padding-left:1.4em;font-size:14.5px}
.points li{margin:2px 0}
h2{font-size:12px;color:var(--ag-muted);font-weight:700;letter-spacing:.08em;margin:22px 0 6px}
svg{display:block;margin:14px 0 4px;max-width:100%;height:auto}
svg text{fill:var(--ag-ink);font-size:14px}
svg .sub{fill:var(--ag-muted);font-size:12px}
svg rect,svg line,svg path,svg circle{stroke:var(--ag-muted);fill:none;stroke-width:1.5}
svg .key rect,svg .key line,svg .key path,svg .key circle{stroke:var(--ag-red);stroke-width:3}
svg .key text{fill:var(--ag-red);font-weight:700}
svg .bar{fill:var(--ag-muted);stroke:none}
svg .key .bar{fill:var(--ag-red)}
.decision{border:1.5px solid var(--ag-amber-dot);background:var(--ag-amber-bg);border-radius:8px;padding:10px 14px;margin:16px 0 8px}
.decision h3{font-size:15px;margin:0 0 6px}
.choice{display:grid;grid-template-columns:3.4em 1fr;gap:8px;margin:3px 0;font-size:14px}
.choice>b{font-size:11.5px;text-align:center;border-radius:4px;height:20px;line-height:18px;margin-top:2px;border:1px solid var(--ag-amber-dot)}
.choice.rec>b{background:var(--ag-amber-dot);color:#fff}
.choice.alt>b{color:var(--ag-amber)}
.choice p{margin:0}
table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.6;margin:16px 0 4px}
th,td{padding:7px 8px;text-align:left;vertical-align:top;border-bottom:1px solid var(--ag-line);overflow-wrap:anywhere}
thead th{font-size:11.5px;color:var(--ag-muted);font-weight:600;letter-spacing:.06em;border-bottom:1.5px solid var(--ag-ink)}
tbody th{font-weight:700}
td p{margin:0}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:0 7px;border-radius:4px;margin-bottom:2px;background:var(--ag-dim);color:var(--ag-muted)}
.tag.priority{background:var(--ag-red-bg);color:var(--ag-red)}
.tag.guess{background:var(--ag-amber-bg);color:var(--ag-amber)}
.tag.unverified{background:var(--ag-ink);color:var(--ag-paper)}
details.rest table{margin-top:4px}
.evidence-line{display:block;font-family:'IBM Plex Mono',Consolas,monospace;font-size:12px;color:var(--ag-muted);margin-top:3px}
.warn{border-left:3px solid var(--ag-muted);padding:2px 12px;margin:4px 0;font-size:14px}
.warn ul{margin:0;padding-left:1.2em}
details{border:1px solid var(--ag-line);border-radius:8px;padding:8px 14px;margin:20px 0 6px}
summary{cursor:pointer;color:var(--ag-link);font-size:13.5px}
details pre{white-space:pre-wrap;font-family:'IBM Plex Mono',Consolas,monospace;font-size:12.5px;color:var(--ag-muted);margin:8px 0 0}

/* ---- 自由な節と詳細 (scripts/new-sheet.py の render_blocks が出す要素) ---- */
.block{scroll-margin-top:12px}
h2.sec{font-size:18px;color:var(--ag-ink);letter-spacing:0;margin:30px 0 8px;padding-left:10px;border-left:4px solid var(--ag-muted)}
.content p{margin:0 0 10px}
.content h3{font-size:15.5px;margin:18px 0 6px}
.content ul,.content ol{margin:0 0 10px;padding-left:1.5em}
.content li{margin:2px 0}
.content table{margin:6px 0 12px}
.content pre,.content blockquote{margin:6px 0 12px}
pre{background:var(--ag-dim);border:1px solid var(--ag-line);border-radius:8px;padding:10px 14px;overflow-x:auto;font-family:'IBM Plex Mono',Consolas,monospace;font-size:13px;line-height:1.6}
p code,li code,td code{background:var(--ag-dim);border:1px solid var(--ag-line);border-radius:4px;padding:0 4px}
blockquote{border-left:3px solid var(--ag-muted);background:var(--ag-dim);border-radius:0 6px 6px 0;padding:8px 14px;font-size:14px}
.figure,pre.mermaid{background:transparent;border:1px solid var(--ag-line);border-radius:8px;padding:14px;overflow-x:auto}
.figure svg,pre.mermaid svg{margin:0 auto}
pre.mermaid:not([data-processed]){background:var(--ag-dim);white-space:pre;font-size:12.5px;color:var(--ag-muted)}
.mermaid-note{font-size:12.5px;color:var(--ag-muted)}
.tag-red{background:var(--ag-red-bg);color:var(--ag-red)}
.tag-yellow{background:var(--ag-amber-bg);color:var(--ag-amber)}
.tag-green{background:var(--ag-green-bg);color:var(--ag-green)}
.tag-gray{background:var(--ag-dim);color:var(--ag-muted)}
.tag-blue{background:rgba(37,99,235,.12);color:var(--ag-link)}
.bar-row{display:grid;grid-template-columns:minmax(80px,1fr) 3fr 3.5rem;align-items:center;gap:12px;margin:6px 0;font-size:14px}
.bar-label{color:var(--ag-muted)}
.bar-track{background:var(--ag-dim);border:1px solid var(--ag-line);border-radius:999px;height:10px;overflow:hidden}
.bar-fill{background:var(--ag-muted);height:100%}
.bar-value{font-family:'IBM Plex Mono',Consolas,monospace;font-size:13px;text-align:right}
/* ---- 読んだ後に動くための仕掛け: 根拠のリンク、返答とコードのコピー、差分 ---- */
a.src{text-decoration:none}
a.src code{color:var(--ag-link);border-bottom:1px dotted var(--ag-link)}
a.src:hover code{background:var(--ag-dim)}
.choice{grid-template-columns:3.4em 1fr auto;align-items:start}
button.copy{font:inherit;font-size:11.5px;line-height:1.4;padding:2px 9px;border-radius:5px;border:1px solid var(--ag-line);background:var(--ag-paper);color:var(--ag-muted);cursor:pointer;white-space:nowrap}
button.copy:hover{color:var(--ag-ink);border-color:var(--ag-muted)}
.choice.rec button.reply{border-color:var(--ag-amber-dot);color:var(--ag-amber)}
pre{position:relative}
pre .code-copy{position:absolute;top:6px;right:6px;opacity:.55}
pre:hover .code-copy{opacity:1}
pre.diff{font-size:13.5px;line-height:1.65}
pre.diff>code{display:block}
pre.diff>code>div{white-space:pre;padding:0 6px;margin:0 -6px;border-left:3px solid transparent}
pre.diff .ln{display:none}
pre.diff.numbered>code>div:not(.d-note):not(.d-hunk){display:grid;grid-template-columns:3.4em 1fr}
pre.diff.numbered .ln{display:block;text-align:right;padding-right:1em;color:var(--ag-muted);opacity:.7;user-select:none}
.d-add{background:var(--ag-green-bg);color:var(--ag-green)}
.d-del{background:var(--ag-red-bg);color:var(--ag-red)}
.d-hunk{color:var(--ag-muted);margin-top:6px !important}
.d-hunk:first-child{margin-top:0 !important}
/* 注記が指す行: 札の色で塗り、左に太い線を引く。注記はその行のすぐ下に、同じ色の線でつないで出す */
.d-target{background:var(--ag-amber-bg);border-left-color:var(--ag-amber-dot) !important;font-weight:700}
.d-target.priority{background:var(--ag-red-bg);border-left-color:var(--ag-red) !important}
.d-target .ln{opacity:1 !important;color:var(--ag-ink) !important}
.d-note{white-space:normal !important;font-family:'IBM Plex Sans JP','Segoe UI','Hiragino Kaku Gothic ProN','Yu Gothic UI',sans-serif;font-size:13.5px;line-height:1.6;color:var(--ag-ink);background:var(--ag-paper);border-left:3px solid var(--ag-amber-dot) !important;padding:5px 12px !important;margin:0 -6px 8px !important;border-radius:0 0 6px 0}
.d-note.priority{border-left-color:var(--ag-red) !important}
pre.diff.numbered .d-note{padding-left:calc(3.4em + 6px) !important}
.d-note code{font-family:'IBM Plex Mono',Consolas,monospace}
.choice.picked{outline:2px solid var(--ag-amber-dot);outline-offset:2px;border-radius:4px}
.reply-all{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:4px 0 12px;font-size:12.5px;color:var(--ag-muted)}
.reply-all button{border-color:var(--ag-amber-dot);color:var(--ag-amber);font-weight:700}
th .tag{margin-right:4px}
/* 対応案の依頼のコピー (SHEET_JS が足す) */
button.act-copy{margin-top:4px}
details.gone ul{margin:6px 0 0;padding-left:1.4em;font-size:13.5px;color:var(--ag-muted)}
/* 詳細: 要判断と優先の数を上に留める */
.jump{position:sticky;top:0;z-index:2;display:flex;gap:8px;justify-content:flex-end;padding:4px 0;background:var(--ag-paper)}
.jump a{font-size:12px;font-weight:700;padding:1px 10px;border-radius:999px;text-decoration:none;background:var(--ag-amber-bg);color:var(--ag-amber)}
.jump a[href^="#item"]{background:var(--ag-red-bg);color:var(--ag-red)}
/* 保存先の一覧 (index.html) */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0}
.filters input,.filters select{font:inherit;font-size:13.5px;padding:3px 8px;border:1px solid var(--ag-line);border-radius:6px;background:var(--ag-paper);color:var(--ag-ink)}
table.index td:first-child{white-space:nowrap;font-family:'IBM Plex Mono',Consolas,monospace;font-size:12.5px}
/* 印刷・PDF: ボタンと留めた帯を隠し、行の途中で改ページしない (畳みは SHEET_JS が開く) */
@media print{
  body{padding:0;font-size:12.5px}
  button.copy,.jump,.reply-all{display:none !important}
  tr,pre,.decision,.figure,svg{break-inside:avoid}
  a{color:inherit}
}
/* 狭い画面: 項目の表を行ごとに縦へ積む */
@media (max-width:600px){
  body{padding:10px 14px 24px}
  table.items colgroup,table.items thead{display:none}
  table.items,table.items tbody,table.items tr,table.items th,table.items td{display:block;width:auto}
  table.items tr{border-bottom:1px solid var(--ag-line);padding:6px 0}
  table.items th,table.items td{border:0;padding:2px 0}
  .choice{grid-template-columns:3.4em 1fr}
  .choice button.reply{grid-column:2;justify-self:start}
}
</style></head>
<body><main>
{{BODY}}
</main>
{{SCRIPTS}}
</body></html>
