<!DOCTYPE html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<!-- review-sheet-format: v5 -->
<!--
  review sheet template (比較シート) — シートの規約 v5。ブラウザで開いて見せ、[判断] は会話で聞く。
  使い方: ./review/<topic>.html としてコピーし、TODO を埋める。再往復でも同じファイルを上書きする (別名で作り直さない)。
  - 骨格は固定: 結論 → 全体図 SVG (赤①②③) → 論点ごとの A/B の絵 (#p1, #p2, …) → 畳み付録
  - 絵が主役。本文の文章は合計 600 字以内。絵で分かることを文で繰り返さない
  - 問いや選択肢の一覧はシートに書かない。問いは会話の [判断] で出し、頭に ①②③ を付けて #p1, #p2, … の絵を指す
  - 相対 URL 禁止 (画像は https 絶対 URL か data URI)。外部 JS ライブラリ禁止。Google Fonts は絶対 URL なので合法
  - 色は 7 トークンのみ。赤 = 提案・訂正・論点の専任 / 青 = 導線 (リンク・ボタン・summary) の専任 / 残りは無彩色
-->
<title><!-- TODO: タイトル (主張) --> — レビュー</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#212529;--muted:#64707C;--line:#DEE2E6;--paper:#FFFFFF;--paper-dim:#F6F8FA;--accent:#2563EB;--red:#DC2626}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans JP','Hiragino Kaku Gothic ProN','Hiragino Sans',-apple-system,sans-serif;font-size:15px;line-height:1.8;margin:0;border-top:3px solid var(--red);padding:8px 24px 40px}
main{max-width:1200px;margin:0 auto}
.kicker{font-family:'IBM Plex Mono',Menlo,monospace;font-size:12.5px;letter-spacing:.08em;color:var(--red);font-weight:600}
h1{font-size:25px;line-height:1.45;margin:8px 0 12px}
h2{font-size:19px;line-height:1.45;margin:30px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
p{margin:8px 0}
a{color:var(--accent)}
.concl{border:1px solid var(--line);border-left:3px solid var(--red);border-radius:10px;padding:12px 18px}
.red{color:var(--red)}
.m{color:var(--muted);font-size:12.5px;line-height:1.7}
.mono{font-family:'IBM Plex Mono',Menlo,monospace;font-size:13.5px}
.gl{font-size:12.5px;color:var(--muted);line-height:1.75;border-left:2px solid var(--line);padding-left:10px;margin:8px 0}
.btn{display:inline-block;border:1px solid var(--accent);color:var(--accent);background:var(--paper);border-radius:8px;padding:4px 14px;font-size:13px;text-decoration:none;cursor:pointer;font-family:inherit;line-height:1.7}
.btn:hover{background:var(--paper-dim)}
figure{margin:14px 0 6px}
figcaption{font-size:12.5px;color:var(--muted);line-height:1.6;padding-top:4px}
svg{max-width:100%;height:auto;display:block}
table{border-collapse:collapse;width:100%;font-size:13.5px;line-height:1.6;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{font-size:11.5px;letter-spacing:.06em;color:var(--muted);font-weight:500;white-space:nowrap;border-bottom:1.5px solid var(--ink)}
td.n{font-family:'IBM Plex Mono',Menlo,monospace;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
details{border:1px solid var(--line);border-radius:10px;padding:10px 16px;margin:24px 0 10px}
summary{cursor:pointer;color:var(--accent);font-weight:500;font-size:13.5px}
/* 論点 (#p1, #p2, …) — [判断] が指す場所。左の赤線と番号で場所を示す */
.pt{border-left:3px solid var(--red);padding-left:16px;margin:22px 0}
.pt .no{font-family:'IBM Plex Mono',Menlo,monospace;font-weight:600;color:var(--red);margin-right:6px}
/* overlay 注記 (赤を画像の上に乗せる部品 — 座標は画像に対する %) */
.shotwrap{position:relative;line-height:0;margin:8px 0 4px}
.shotwrap img{width:100%;border:1px solid var(--line);border-radius:8px;display:block}
.shotwrap .mark{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border:2.5px solid var(--red);border-radius:50%;background:rgba(255,255,255,.78);color:var(--red);font:600 13px/21px 'IBM Plex Mono',Menlo,monospace;text-align:center}
.shotwrap .lbl{position:absolute;transform:translateX(-50%);background:var(--red);color:#fff;font:700 11px/1.5 sans-serif;padding:2px 8px;border-radius:4px;white-space:nowrap}
/* A/B 対比 (選択肢の対立軸を並べる部品) */
.ab{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.ab figure{margin:0}.ab figcaption{font-size:12.5px;color:var(--muted);line-height:1.6;padding-top:4px}
@media (max-width:900px){.ab{grid-template-columns:1fr}}
del{color:var(--muted)}
@media print{summary{color:var(--ink)}details{border:none;padding:0}details[open] summary{display:none}}
</style></head>
<body><main>

<div class="kicker">✎ REVIEW — <!-- TODO: YYYY-MM-DD --></div>
<h1><!-- TODO: タイトル — 主張の言い切り。1 行に収まる長さ --></h1>
<div class="concl"><b>結論:</b> <!-- TODO: 2 文以内・120 字以内。何をどこに、なぜ --></div>

<!-- 任意: 動く論点 (操作感・頻度) があるときだけ。モックを ./review/mock/ に置き、絶対パスの file:// URL で -->
<!-- <p><a class="btn" href="file:///ABS/PATH/review/mock/index.html" target="_blank">▶ モックを触って確認</a></p> -->

<!-- 全体図: 論点 3 つ以上なら必須。インライン SVG で題材の全体像を描き、論点の場所に赤の ①②③ を打つ。
     既存画面に加えるなら、ここを現物スクショ (.shotwrap に赤丸 overlay) か DOM 再現にしてよい -->
<figure>
<svg viewBox="0 0 1100 220" role="img" aria-label="TODO: 全体図の説明">
  <style>
    .bt{font:600 13px 'IBM Plex Sans JP',sans-serif;fill:#212529}
    .bl{font:400 12px 'IBM Plex Sans JP',sans-serif;fill:#64707C}
    .rd{font:600 12px 'IBM Plex Sans JP',sans-serif;fill:#DC2626}
    .num{font:600 12px 'IBM Plex Mono',monospace;fill:#DC2626}
    .box{fill:#F6F8FA;stroke:#DEE2E6;stroke-width:1}
    .boxr{fill:#FFF5F5;stroke:#DC2626;stroke-width:1.4}
  </style>
  <rect x="20" y="30" width="300" height="80" rx="6" class="box"/><text x="36" y="76" class="bl">現状の部品</text>
  <rect x="360" y="30" width="300" height="80" rx="6" class="boxr"/><text x="376" y="76" class="rd">提案で変わる部品</text>
  <circle cx="646" cy="44" r="11" fill="none" stroke="#DC2626" stroke-width="2"/><text x="642" y="48" class="num">1</text>
</svg>
<figcaption><!-- TODO: 1 行。赤の ①②③ が論点の場所 --></figcaption>
</figure>

<!-- 論点: 1 論点 = 1 つの .pt。id は p1, p2, … で、[判断] JSON の selector (#p1 …) と一致させる。
     中身は見出し + A / B の絵 + 各 1 行のキャプションだけ。段落を足さない。問い・利点/代償・推奨は会話の [判断] に書く -->
<section class="pt" id="p1">
  <h2><span class="no">①</span><!-- TODO: 何の違いを見るか (問いの形にしない) --></h2>
  <div class="ab">
    <figure><!-- TODO: A の絵 (インライン SVG / data URI の img / DOM 再現) --><figcaption><!-- TODO: 案の名前 ([判断] と同じ語) — 1 行 --></figcaption></figure>
    <figure><!-- TODO: B の絵 --><figcaption><!-- TODO: 案の名前 — 1 行 --></figcaption></figure>
  </div>
</section>

<!-- TODO: #p2, #p3 … (3±1。5 つ以上並べない) -->

<!-- 任意の畳み付録: 判断から外した決定事項・落とした案・実測ログ。summary は中身と分量を予告する (「詳細」「その他」は禁止)。無ければ削除 -->
<details><summary><!-- TODO: 例「判断から外した 3 点と落とした案 2 つ」 --></summary>
<p class="m"><!-- TODO --></p>
</details>

<!-- 再往復のときだけ: 撤回した案を <del>取り消し線</del> で残す -->

</main>
</body>
</html>
